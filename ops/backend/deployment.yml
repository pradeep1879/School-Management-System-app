apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: pradeep1879/school-backend:v1

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret